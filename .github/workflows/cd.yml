name: CD

# Required GitHub Actions secrets:
#   EC2_HOST, EC2_USERNAME, EC2_SSH_KEY
#
# EC2 must have Docker, the repository in ~/TEO1_ClinicaDental and its local .env.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Do not interrupt an active SSH deployment. Stale commits are rejected below.
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image.outputs.backend_image }}
      frontend_image: ${{ steps.image.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Rechazar una ejecución de CI obsoleta
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$DEPLOY_SHA" ]]; then
            echo 'El commit validado ya no es la punta de main; no se publicará ni desplegará.' >&2
            exit 1
          fi

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${owner}/clinica-dental-backend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/clinica-dental-frontend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.backend_image }}

      - name: Build y push de la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./clinica-dental-frontend
          push: true
          tags: ${{ steps.image.outputs.frontend_image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          CORS_ALLOWED_ORIGINS: http://${{ secrets.EC2_HOST }}:4200
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA,BACKEND_IMAGE,FRONTEND_IMAGE,CORS_ALLOWED_ORIGINS,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd ~/TEO1_ClinicaDental
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo 'El commit validado ya no es la punta de main; se cancela el despliegue.' >&2
              exit 1
            fi
            git checkout --force --detach "$DEPLOY_SHA"
            bash scripts/deploy-ec2.sh
