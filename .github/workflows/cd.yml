name: CD

# Falta configurar en GitHub: Settings > Secrets and variables > Actions
#   EC2_HOST, EC2_USERNAME, EC2_SSH_KEY (la llave .pem completa)
#
# La EC2 ya debe tener Docker y el repo con su .env configurado.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "clinica-dental-frontend/**"
      - "db/**"
      - "docker-compose.yml"
      - ".github/workflows/cd.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image.outputs.backend_image }}
      frontend_image: ${{ steps.image.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${owner}/clinica-dental-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/clinica-dental-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.backend_image }}

      - name: Build y push de la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./clinica-dental-frontend
          push: true
          tags: ${{ steps.image.outputs.frontend_image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TEO1_ClinicaDental
            git pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE='${{ needs.build-and-push.outputs.backend_image }}'
            export FRONTEND_IMAGE='${{ needs.build-and-push.outputs.frontend_image }}'
            docker compose pull backend frontend
            docker compose up -d --no-build backend frontend
            docker image prune -f
