name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "db/**"
      - "clinica-dental-frontend/**"
      - "scripts/deploy-ec2.sh"
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "db/**"
      - "clinica-dental-frontend/**"
      - "scripts/deploy-ec2.sh"
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinica_dental_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d clinica_dental_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar secretos de CI
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          test -n "$CI_DB_PASSWORD" || { echo 'Configure CI_DB_PASSWORD en Actions Secrets' >&2; exit 1; }
          test -n "$CI_JWT_SECRET" || { echo 'Configure CI_JWT_SECRET en Actions Secrets' >&2; exit 1; }

      - name: Validar sintaxis del script de despliegue
        run: bash -n scripts/deploy-ec2.sh

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Cargar esquema en la base de datos de pruebas
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U ci_user -d clinica_dental_ci -v ON_ERROR_STOP=1 -f db/clinica_dental_schema.sql

      - name: Compilar y ejecutar pruebas
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/clinica_dental_ci
          DB_USERNAME: ci_user
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          # Keep email reminders disabled in CI.
          SMTP_HOST: ""
          SMTP_FROM: ""
        run: ./mvnw -B verify

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
          package-manager-cache: false
          cache-dependency-path: clinica-dental-frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: clinica-dental-frontend
        run: npm ci

      - name: Compilar frontend en producción
        working-directory: clinica-dental-frontend
        run: npm run build -- --configuration production

      - name: Ejecutar pruebas del frontend
        working-directory: clinica-dental-frontend
        run: npm test -- --no-watch --no-progress

      - name: Construir imagen Docker del backend
        run: docker build --tag clinica-dental-backend:ci ./backend

      - name: Construir imagen Docker del frontend
        run: docker build --tag clinica-dental-frontend:ci ./clinica-dental-frontend
