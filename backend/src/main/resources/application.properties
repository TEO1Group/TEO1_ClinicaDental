spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_dental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# El esquema es la fuente de verdad: db/clinica_dental_schema.sql.
# 'validate' hace que el arranque falle si una entidad no coincide con la tabla,
# en lugar de crear tablas paralelas silenciosamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Ordenes permitidos para CORS (frontend Angular). Lista separada por comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}