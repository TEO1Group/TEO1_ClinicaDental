spring.application.name=backend
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_dental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# El esquema es la fuente de verdad: db/clinica_dental_schema.sql.
# 'validate' hace que el arranque falle si una entidad no coincide con la tabla,
# en lugar de crear tablas paralelas silenciosamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Ordenes permitidos para CORS (frontend Angular). Lista separada por comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial, solo se crea si no existe ningun ADMIN.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.zona-horaria=America/Guatemala

app.citas.duracion-minutos=30
app.citas.antelacion-cancelacion-horas=24

# Correo de recordatorio de citas (HU-15). Si SMTP_HOST o SMTP_FROM estan vacios no se envia nada.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remitente=${SMTP_FROM:}

# Avisa por correo las citas de las proximas 24 horas. Por defecto una vez al dia a las 07:00.
# Formato cron de Spring (segundo minuto hora dia mes dia-semana); RECORDATORIO_CRON lo cambia para la demo.
app.citas.recordatorio-cron=${RECORDATORIO_CRON:0 0 7 * * *}
