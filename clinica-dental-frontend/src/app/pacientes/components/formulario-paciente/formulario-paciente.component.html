<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="mb-3">
        <a [routerLink]="['/pacientes', pacienteId]" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Volver al detalle
        </a>
      </div>

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold text-primario mb-1">Editar paciente</h2>
          @if (nombrePaciente()) {
            <p class="text-muted mb-4">{{ nombrePaciente() }}</p>
          }

          @if (error()) {
            <div class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error() }}
            </div>
          }

          @if (mensaje()) {
            <div class="alert alert-success" role="status">
              <i class="bi bi-check-circle-fill me-2"></i>{{ mensaje() }}
            </div>
          }

          @if (cargando()) {
            <div class="text-center py-5">
              <div class="spinner-border text-primario" role="status">
                <span class="visually-hidden">Cargando...</span>
              </div>
              <p class="text-muted mt-3 mb-0">Cargando datos del paciente...</p>
            </div>
          } @else {
            <form [formGroup]="editarForm" (ngSubmit)="guardarCambios()" novalidate>
              <div class="mb-3">
                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                <input id="telefono" type="tel" class="form-control" formControlName="telefono" />
              </div>

              <div class="mb-3">
                <label for="direccion" class="form-label fw-semibold">Dirección</label>
                <textarea id="direccion" class="form-control" rows="3" formControlName="direccion"></textarea>
              </div>

              <div class="mb-4">
                <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de nacimiento</label>
                <input id="fechaNacimiento" type="date" class="form-control" formControlName="fechaNacimiento" />
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a [routerLink]="['/pacientes', pacienteId]" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primario text-white" [disabled]="guardando()">
                  @if (guardando()) {
                    <span class="spinner-border spinner-border-sm me-2"></span>
                  }
                  Guardar cambios
                </button>
              </div>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
