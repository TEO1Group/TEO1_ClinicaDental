<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true"><i class="bi bi-heart-pulse-fill"></i></div>
    <p class="eyebrow">Clínica Dental</p>
    <h1 id="login-title">Bienvenido</h1>
    <p class="intro">Ingresa para gestionar tus citas y tu expediente médico.</p>

    <div *ngIf="successMessage" class="alert alert-success" role="status">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field-group">
        <label for="usuario">Usuario</label>
        <div class="input-wrap">
          <i class="bi bi-person" aria-hidden="true"></i>
          <input id="usuario" type="text" formControlName="usuario" placeholder="Tu DPI" autocomplete="username"
            [class.is-invalid]="loginForm.controls.usuario.touched && loginForm.controls.usuario.invalid" />
        </div>
        <small *ngIf="loginForm.controls.usuario.touched && loginForm.controls.usuario.hasError('required')" class="field-error">
          El usuario es obligatorio.
        </small>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input id="password" type="password" formControlName="password" placeholder="Tu contraseña" autocomplete="current-password"
            [class.is-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid" />
        </div>
        <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.hasError('required')" class="field-error">
          La contraseña es obligatoria.
        </small>
      </div>

      <button class="login-button" type="submit" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        Ingresar
      </button>
    </form>

    <p class="register-prompt">¿Aún no tienes una cuenta? <a routerLink="/registro">Registrarse</a></p>
  </section>
</main>
