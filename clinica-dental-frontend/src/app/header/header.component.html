<header class="header-principal">
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center py-3">

      <div class="d-flex align-items-center gap-3">
        <!-- Botón hamburguesa, solo visible en mobile -->
        <button class="btn-hamburguesa" type="button" (click)="toggle()" aria-label="Abrir menú">
          <i class="bi bi-list"></i>
        </button>

        <!-- Marca -->
        <div class="d-flex align-items-center gap-2">
          <div class="brand-logo-wrap">
            <img src="logo.jpeg" alt="Clínica Dental" class="brand-logo" />
          </div>
          <span class="brand-text">Clínica Dental</span>
        </div>
      </div>

      <!-- Info del usuario y logout -->
      <div class="d-flex align-items-center gap-3">
        @if (usuarioActual()) {
          <span class="usuario-nombre">{{ usuarioActual()!.nombre }} {{ usuarioActual()!.apellido }}</span>
        }
        <button 
          type="button" 
          class="btn btn-outline-light btn-sm"
          (click)="logout()"
        >
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
        </button>
      </div>

    </div>
  </div>
</header>
