<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="mb-3">
        <a routerLink="/planes" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver a planes</a>
      </div>

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold text-primario mb-1">Nuevo plan de tratamiento</h2>
          <p class="text-muted mb-4">Define las sesiones y el tratamiento del paciente</p>

          @if (error()) {
            <div class="alert alert-danger" role="alert">{{ error() }}</div>
          }

          @if (cargando()) {
            <div class="text-center py-5"><div class="spinner-border text-primario" role="status"><span class="visually-hidden">Cargando...</span></div></div>
          } @else {
            <form [formGroup]="planForm" (ngSubmit)="crearPlan()" novalidate>
              <div class="mb-3">
                <label for="idCliente" class="form-label fw-semibold">Paciente</label>
                <select id="idCliente" class="form-select" formControlName="idCliente">
                  <option value="">Selecciona un paciente</option>
                  @for (paciente of pacientes(); track paciente.idCliente) {
                    <option [value]="paciente.idCliente">{{ paciente.nombre }} {{ paciente.apellido }} - {{ paciente.dpi }}</option>
                  }
                </select>
              </div>

              @if (!esDoctor()) {
                <div class="mb-3">
                  <label for="idDoctor" class="form-label fw-semibold">Doctor</label>
                  <select id="idDoctor" class="form-select" formControlName="idDoctor">
                    <option value="">Selecciona un doctor</option>
                    @for (doctor of doctores(); track doctor.idDoctor) {
                      <option [value]="doctor.idDoctor">{{ doctor.nombre }} {{ doctor.apellido }} - {{ doctor.especialidad }}</option>
                    }
                  </select>
                </div>
              }

              <div class="mb-3">
                <label for="idTratamiento" class="form-label fw-semibold">Tratamiento</label>
                <select id="idTratamiento" class="form-select" formControlName="idTratamiento">
                  <option value="">Selecciona un tratamiento</option>
                  @for (tratamiento of tratamientos(); track tratamiento.idTratamiento) {
                    <option [value]="tratamiento.idTratamiento">{{ tratamiento.nombre }} - Q {{ tratamiento.costo | number:'1.2-2' }}</option>
                  }
                </select>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="totalSesiones" class="form-label fw-semibold">Total de sesiones</label>
                  <input id="totalSesiones" type="number" min="1" max="50" class="form-control" formControlName="totalSesiones" />
                </div>
                <div class="col-md-6">
                  <label for="costoTotal" class="form-label fw-semibold">Costo total opcional</label>
                  <div class="input-group"><span class="input-group-text">Q</span><input id="costoTotal" type="number" min="0" step="0.01" class="form-control" formControlName="costoTotal" placeholder="Usar costo del catálogo" /></div>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a routerLink="/planes" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primario text-white" [disabled]="guardando()">
                  @if (guardando()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                  <i class="bi bi-plus-lg me-2"></i>Crear plan
                </button>
              </div>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
